[project]
name = "knowhow-harness"
version = "0.1.0"
description = "Personal usable agent runtime: LangGraph, MCP, RAG, memory, eval, and Langfuse."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.4",
  "langchain>=1",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "langchain-mcp-adapters>=0.1",
  "langfuse>=3",
  "mcp>=1.9",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.scripts]
knowhow = "knowhow.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowhow = ["py.typed", "web/index.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "servers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
