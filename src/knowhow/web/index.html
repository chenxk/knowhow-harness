<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Knowhow 工作台</title>
  <style>
    :root {
      --paper: #f3ecdf;
      --panel: #faf6ee;
      --ink: #241c15;
      --muted: #6f6458;
      --line: #e2d5c3;
      --margin: #b5523a;
      --retrieve: #1f6b4a;
      --tool: #9a3412;
      --answer: #243e66;
      --shadow: 0 16px 40px rgba(36, 28, 21, 0.08);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      background:
        linear-gradient(90deg, transparent 47px, rgba(181, 82, 58, 0.35) 47px, rgba(181, 82, 58, 0.35) 48px, transparent 48px),
        repeating-linear-gradient(var(--paper), var(--paper) 31px, rgba(36, 28, 21, 0.04) 32px);
      font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    header, main, aside { position: relative; }

    header {
      flex: none;
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-end;
      padding: 16px 28px 12px 56px;
    }

    .brand {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 1.5px solid var(--ink);
      border-radius: 4px;
      font-family: Palatino, "Palatino Linotype", "Iowan Old Style", serif;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: var(--panel);
    }

    h1 {
      margin: 0;
      font-family: Palatino, "Palatino Linotype", "Iowan Old Style", serif;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .sub {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .facts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .fact {
      padding: 6px 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 12px;
    }

    .layout {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      gap: 16px;
      padding: 0 28px 16px 56px;
    }

    aside, .desk {
      background: rgba(250, 246, 238, 0.92);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    aside {
      min-height: 0;
      overflow: auto;
      padding: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input, textarea, button { font: inherit; color: inherit; }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: white;
      padding: 10px 12px;
    }

    textarea {
      height: 56px;
      max-height: 120px;
      resize: none;
      line-height: 1.5;
    }

    button, .chip {
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--paper);
      padding: 9px 12px;
      cursor: pointer;
    }

    button.secondary, .chip {
      background: transparent;
      color: var(--ink);
    }

    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.busy:disabled { cursor: wait; }
    .feedback button:disabled { cursor: default; opacity: 1; }

    .row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .row button { flex: 1; }

    .session-toolbar {
      display: grid;
      gap: 8px;
    }

    #session-list, #memory-list {
      display: grid;
      gap: 6px;
      margin-top: 14px;
    }

    .panel-title {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .session-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      align-items: start;
      width: 100%;
      padding: 10px;
      border: 1px solid var(--line);
      background: white;
      text-align: left;
      cursor: pointer;
    }

    .session-item.active {
      border-color: var(--ink);
      background: #fffaf2;
    }

    .session-item .title {
      font-size: 14px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .session-item .when {
      margin-top: 4px;
      color: var(--muted);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 11px;
    }

    .session-item .ops {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .session-item .ops button {
      padding: 4px 6px;
      font-size: 11px;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

    .chip { padding: 6px 8px; font-size: 13px; }

    #eval {
      margin-top: 18px;
      display: grid;
      gap: 6px;
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 12px;
    }

    .pass { color: var(--retrieve); }
    .fail { color: var(--margin); }

    .desk {
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #transcript {
      flex: 1;
      min-height: 0;
      padding: 20px 22px 8px;
      overflow-x: hidden;
      overflow-y: auto;
      overflow-anchor: none;
    }

    .empty {
      color: var(--muted);
      padding: 48px 8px;
      font-family: Palatino, "Palatino Linotype", serif;
      font-size: 22px;
    }

    .turn { margin: 0 0 18px; width: 100%; max-width: 760px; }

    .turn.user .bubble { background: #fffaf2; }

    .who {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    .bubble {
      padding: 12px 14px;
      background: white;
      border: 1px solid var(--line);
      white-space: pre-wrap;
      line-height: 1.55;
    }

    .body {
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .body > :first-child { margin-top: 0; }
    .body > :last-child { margin-bottom: 0; }

    .body p, .body ul, .body ol, .body blockquote, .body pre { margin: 0 0 0.7em; }

    .body h1, .body h2, .body h3 {
      margin: 0.2em 0 0.45em;
      font-family: Palatino, "Palatino Linotype", serif;
      font-weight: 600;
      line-height: 1.3;
    }

    .body h1 { font-size: 1.35em; }
    .body h2 { font-size: 1.15em; }
    .body h3 { font-size: 1.05em; }

    .body ul, .body ol { padding-left: 1.3em; }

    .body blockquote {
      padding-left: 12px;
      border-left: 3px solid var(--line);
      color: var(--muted);
    }

    .body a { color: var(--answer); }

    .body code {
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 0.92em;
      background: #f3ecdf;
      padding: 0 4px;
    }

    .body pre {
      padding: 10px 12px;
      overflow: auto;
      background: #f7f1e6;
      border: 1px solid var(--line);
    }

    .body pre code { background: none; padding: 0; }

    .body .lang {
      margin-bottom: 6px;
      color: var(--muted);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 12px;
    }

    .stamp[hidden], .meta[hidden] { display: none; }

    .stamp {
      display: block;
      width: fit-content;
      margin-bottom: 8px;
      padding: 2px 8px;
      border: 1.5px solid currentColor;
      font-family: Palatino, "Palatino Linotype", serif;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .stamp.retrieve { color: var(--retrieve); }
    .stamp.tool { color: var(--tool); }
    .stamp.answer { color: var(--answer); }

    .turn.assistant.pending .body::after {
      content: "▍";
      margin-left: 1px;
      color: var(--margin);
      animation: caret 1s steps(1) infinite;
    }

    @keyframes caret {
      50% { opacity: 0; }
    }

    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 12px;
    }

    .feedback {
      display: none;
      gap: 8px;
      margin-top: 8px;
      align-items: center;
    }

    .feedback.open { display: flex; }

    .feedback button {
      padding: 4px 10px;
      font-size: 12px;
    }

    .feedback button.active {
      background: var(--retrieve);
      border-color: var(--retrieve);
      color: white;
    }

    .feedback .hint {
      color: var(--muted);
      font-size: 12px;
    }

    form {
      flex: none;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
      padding: 14px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    #error {
      display: none;
      flex: none;
      margin: 0;
      padding: 8px 14px 0;
      color: var(--margin);
      font-size: 14px;
    }

    @media (max-width: 860px) {
      header, .layout { padding-left: 16px; padding-right: 16px; }
      .layout {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr);
      }
      aside { max-height: 32vh; }
      body { background: var(--paper); }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="mark">KH</div>
      <div>
        <h1>工作台</h1>
        <p class="sub">会话与长期记忆 · 看路由、来源和工具结果</p>
      </div>
    </div>
    <div class="facts" id="facts"></div>
  </header>
  <div class="layout">
    <aside>
      <div class="session-toolbar">
        <button type="button" id="new-session">新对话</button>
        <button type="button" class="secondary" id="run-eval">跑黄金集</button>
      </div>
      <div id="session-list"></div>
      <div class="panel-title">长期记忆</div>
      <div id="memory-list"></div>
      <div class="chips" id="chips"></div>
      <div id="eval"></div>
    </aside>
    <section class="desk">
      <div id="transcript"><p class="empty">写下一个问题。会话会保存在本机。</p></div>
      <p id="error"></p>
      <form id="composer">
        <textarea id="question" placeholder="例如：如何重置密码"></textarea>
        <button type="submit" id="send">发送</button>
      </form>
    </section>
  </div>
  <script>
    const actionLabel = { retrieve: "检索", tool: "工具", answer: "直接回答" };
    const samples = ["请记住：我叫小明", "我叫什么名字", "如何重置密码", "现在几点"];
    const transcript = document.querySelector("#transcript");
    const error = document.querySelector("#error");
    const question = document.querySelector("#question");
    const send = document.querySelector("#send");
    const sessionList = document.querySelector("#session-list");
    const memoryList = document.querySelector("#memory-list");
    let log = [];
    let sessions = [];
    let memories = [];
    let currentSessionId = "";
    let tracingOn = false;

    samples.forEach((text) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "chip";
      button.textContent = text;
      button.addEventListener("click", () => ask(text));
      document.querySelector("#chips").append(button);
    });

    document.querySelector("#new-session").addEventListener("click", () => createSession());

    document.querySelector("#run-eval").addEventListener("click", async () => {
      showError("");
      const box = document.querySelector("#eval");
      box.textContent = "评测进行中";
      const response = await fetch("/api/eval", { method: "POST" });
      const data = await response.json();
      if (!response.ok) {
        showError(detail(data));
        box.replaceChildren();
        return;
      }
      box.replaceChildren();
      const summary = document.createElement("div");
      summary.textContent = data.passed + " 通过，" + data.failed + " 失败"
        + (data.scored ? " · 已写 Langfuse score" : "");
      box.append(summary);
      data.rows.forEach((row) => {
        const line = document.createElement("div");
        line.className = row.passed ? "pass" : "fail";
        const note = row.failures.length ? " " + row.failures.join(", ") : "";
        line.textContent = (row.passed ? "pass " : "fail ") + row.case_id + " " + row.action + note;
        box.append(line);
      });
    });

    document.querySelector("#composer").addEventListener("submit", (event) => {
      event.preventDefault();
      ask(question.value);
    });

    question.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        ask(question.value);
      }
    });

    boot();

    async function boot() {
      await loadMeta();
      await refreshSessions();
      await refreshMemories();
      if (!sessions.length) {
        await createSession(false);
        return;
      }
      await selectSession(sessions[0].id);
    }

    async function loadMeta() {
      const response = await fetch("/api/meta");
      const data = await response.json();
      tracingOn = Boolean(data.tracing);
      const facts = document.querySelector("#facts");
      ["mode " + data.mode, "chunks " + data.corpus_chunks, "memories " + (data.memory_count || 0), "tools " + data.tools.join(","), "skills " + data.skills.join(","), data.tracing ? "langfuse on" : "langfuse off"].forEach((text) => {
        const item = document.createElement("span");
        item.className = "fact";
        item.textContent = text;
        facts.append(item);
      });
    }

    async function refreshSessions() {
      const response = await fetch("/api/sessions");
      sessions = await response.json();
      renderSessions();
    }

    async function refreshMemories() {
      const response = await fetch("/api/memories");
      memories = await response.json();
      renderMemories();
    }

    function renderMemories() {
      memoryList.replaceChildren();
      if (!memories.length) {
        const empty = document.createElement("div");
        empty.className = "when";
        empty.textContent = "还没有记忆";
        memoryList.append(empty);
        return;
      }
      memories.forEach((memory) => {
        const item = document.createElement("div");
        item.className = "session-item";
        const main = document.createElement("div");
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = memory.content;
        const when = document.createElement("div");
        when.className = "when";
        when.textContent = (memory.category || "other") + " · " + formatWhen(memory.updated_at);
        main.append(title, when);
        const ops = document.createElement("div");
        ops.className = "ops";
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "secondary";
        remove.textContent = "删除";
        remove.addEventListener("click", () => deleteMemory(memory.id));
        ops.append(remove);
        item.append(main, ops);
        memoryList.append(item);
      });
    }

    async function deleteMemory(memoryId) {
      if (!window.confirm("删除这条记忆？")) return;
      const response = await fetch("/api/memories/" + encodeURIComponent(memoryId), { method: "DELETE" });
      if (!response.ok) {
        const data = await response.json();
        showError(detail(data));
        return;
      }
      await refreshMemories();
    }

    function renderSessions() {
      sessionList.replaceChildren();
      if (!sessions.length) {
        const empty = document.createElement("div");
        empty.className = "when";
        empty.textContent = "还没有会话";
        sessionList.append(empty);
        return;
      }
      sessions.forEach((session) => {
        const item = document.createElement("div");
        item.className = "session-item" + (session.id === currentSessionId ? " active" : "");
        const main = document.createElement("button");
        main.type = "button";
        main.className = "secondary";
        main.style.border = "none";
        main.style.background = "transparent";
        main.style.padding = "0";
        main.style.textAlign = "left";
        main.style.width = "100%";
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = session.title || "新对话";
        const when = document.createElement("div");
        when.className = "when";
        when.textContent = formatWhen(session.updated_at);
        main.append(title, when);
        main.addEventListener("click", () => selectSession(session.id));
        const ops = document.createElement("div");
        ops.className = "ops";
        const rename = document.createElement("button");
        rename.type = "button";
        rename.className = "secondary";
        rename.textContent = "改名";
        rename.addEventListener("click", (event) => {
          event.stopPropagation();
          renameSession(session);
        });
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "secondary";
        remove.textContent = "删除";
        remove.addEventListener("click", (event) => {
          event.stopPropagation();
          deleteSession(session.id);
        });
        ops.append(rename, remove);
        item.append(main, ops);
        sessionList.append(item);
      });
    }

    function formatWhen(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString("zh-CN", {
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    async function createSession(select = true) {
      showError("");
      const response = await fetch("/api/sessions", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
      const data = await response.json();
      if (!response.ok) {
        showError(detail(data));
        return;
      }
      await refreshSessions();
      if (select) await selectSession(data.id);
    }

    async function selectSession(sessionId) {
      if (!sessionId) return;
      showError("");
      const response = await fetch("/api/sessions/" + encodeURIComponent(sessionId));
      const data = await response.json();
      if (!response.ok) {
        showError(detail(data));
        return;
      }
      currentSessionId = data.id;
      log = (data.messages || []).map((message) => ({
        role: message.role,
        content: message.content || "",
        action: message.action || "",
        sources: message.sources || [],
        tool_name: message.tool_name || "",
        trace_id: message.trace_id || null,
        pending: false,
      }));
      renderSessions();
      render();
      question.focus();
    }

    async function renameSession(session) {
      const next = window.prompt("会话标题", session.title || "新对话");
      if (next === null) return;
      const title = next.trim();
      if (!title) {
        showError("标题不能为空");
        return;
      }
      const response = await fetch("/api/sessions/" + encodeURIComponent(session.id), {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title }),
      });
      const data = await response.json();
      if (!response.ok) {
        showError(detail(data));
        return;
      }
      await refreshSessions();
    }

    async function deleteSession(sessionId) {
      if (!window.confirm("删除这个会话？")) return;
      const response = await fetch("/api/sessions/" + encodeURIComponent(sessionId), { method: "DELETE" });
      if (!response.ok) {
        const data = await response.json();
        showError(detail(data));
        return;
      }
      if (currentSessionId === sessionId) {
        currentSessionId = "";
        log = [];
        render();
      }
      await refreshSessions();
      if (!sessions.length) {
        await createSession();
        return;
      }
      if (!currentSessionId) await selectSession(sessions[0].id);
    }

    async function ask(text) {
      const content = text.trim();
      if (!content) {
        showError("问题不能为空");
        return;
      }
      if (!currentSessionId) {
        showError("请先创建会话");
        return;
      }
      showError("");
      send.disabled = true;
      send.classList.add("busy");
      log.push({ role: "user", content });
      render();
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: content, session_id: currentSessionId }),
        });
        if (!response.ok) {
          const data = await response.json();
          showError(detail(data));
          log.pop();
          render();
          return;
        }
        question.value = "";
        await readStream(response);
        await refreshSessions();
        await refreshMemories();
      } catch (err) {
        showError("请求失败");
      } finally {
        send.classList.remove("busy");
        send.disabled = false;
        question.focus();
      }
    }

    function assistantTurn() {
      const last = log[log.length - 1];
      if (!last || last.role !== "assistant") {
        log.push({
          role: "assistant",
          content: "",
          action: "",
          sources: [],
          tool_name: "",
          trace_id: null,
          pending: true,
        });
      }
      return log[log.length - 1];
    }

    async function readStream(response) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      const turn = assistantTurn();
      while (true) {
        const step = await reader.read();
        if (step.done) break;
        buffer += decoder.decode(step.value, { stream: true });
        const blocks = buffer.split("\n\n");
        buffer = blocks.pop() || "";
        for (const block of blocks) {
          const line = block.split("\n").find((item) => item.startsWith("data: "));
          if (!line) continue;
          const event = JSON.parse(line.slice(6));
          applyEvent(turn, event);
          if (event.type === "delta") {
            await new Promise((resolve) => requestAnimationFrame(resolve));
          }
        }
      }
    }

    function applyEvent(turn, event) {
      if (event.type === "error") {
        showError(event.text || "请求失败");
        turn.pending = false;
        paintAssistant(turn);
        return;
      }
      if (event.type === "session") {
        const row = sessions.find((item) => item.id === event.id);
        if (row) {
          row.title = event.title;
          row.updated_at = event.updated_at;
          renderSessions();
        }
        return;
      }
      if (event.type === "status" || event.type === "done") {
        turn.action = event.action || turn.action;
        turn.sources = event.sources || [];
        turn.tool_name = event.tool_name || "";
        if (event.type === "done") {
          turn.pending = false;
          turn.trace_id = event.trace_id;
          if (event.answer) turn.content = event.answer;
        }
        paintAssistant(turn);
        return;
      }
      if (event.type === "delta") {
        turn.content += event.text || "";
        paintAssistant(turn);
      }
    }

    function render() {
      transcript.replaceChildren();
      if (!log.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "写下一个问题。会话会保存在本机。";
        transcript.append(empty);
        return;
      }
      log.forEach((message) => {
        if (message.role === "user") mountUser(message);
        else {
          mountAssistant(message);
          paintAssistant(message);
        }
      });
      follow(true);
    }

    function mountUser(message) {
      const article = document.createElement("article");
      article.className = "turn user";
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = "提问";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = message.content;
      article.append(who, bubble);
      transcript.append(article);
    }

    function mountAssistant(turn) {
      const article = document.createElement("article");
      article.className = "turn assistant";
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = "回答";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      const stamp = document.createElement("div");
      stamp.className = "stamp";
      stamp.hidden = true;
      const body = document.createElement("div");
      body.className = "body";
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.hidden = true;
      const feedback = document.createElement("div");
      feedback.className = "feedback";
      const up = document.createElement("button");
      up.type = "button";
      up.className = "secondary";
      up.textContent = "有用";
      const down = document.createElement("button");
      down.type = "button";
      down.className = "secondary";
      down.textContent = "没用";
      const hint = document.createElement("span");
      hint.className = "hint";
      feedback.append(up, down, hint);
      bubble.append(stamp, body);
      article.append(who, bubble, meta, feedback);
      transcript.append(article);
      turn.node = { article, stamp, body, meta, feedback, up, down, hint };
      up.addEventListener("click", () => sendFeedback(turn, 1));
      down.addEventListener("click", () => sendFeedback(turn, 0));
    }

    async function sendFeedback(turn, value) {
      if (!turn.trace_id || turn.feedback === value) return;
      showError("");
      turn.node.up.disabled = true;
      turn.node.down.disabled = true;
      try {
        const response = await fetch("/api/scores", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            trace_id: turn.trace_id,
            value,
            comment: value ? "thumbs up" : "thumbs down",
          }),
        });
        const data = await response.json();
        if (!response.ok) {
          showError(detail(data));
          turn.node.up.disabled = false;
          turn.node.down.disabled = false;
          return;
        }
        turn.feedback = value;
        paintAssistant(turn);
      } catch (err) {
        showError("score 写入失败");
        turn.node.up.disabled = false;
        turn.node.down.disabled = false;
      }
    }

    function renderMarkdown(source) {
      const text = String(source || "").replace(/\r\n/g, "\n");
      return splitFences(text).map((part) => {
        if (part.type === "code") return codeBlock(part.text, part.lang);
        return renderBlocks(part.text);
      }).join("");
    }

    function splitFences(text) {
      const parts = [];
      const re = /```([^\n`]*)\n([\s\S]*?)```/g;
      let last = 0;
      let match;
      while ((match = re.exec(text))) {
        parts.push({ type: "md", text: text.slice(last, match.index) });
        parts.push({ type: "code", lang: match[1].trim(), text: match[2] });
        last = match.index + match[0].length;
      }
      const rest = text.slice(last);
      const openAt = rest.indexOf("```");
      if (openAt === -1) {
        parts.push({ type: "md", text: rest });
        return parts;
      }
      const open = rest.slice(openAt).match(/```([^\n`]*)\n?([\s\S]*)$/);
      parts.push({ type: "md", text: rest.slice(0, openAt) });
      parts.push({ type: "code", lang: (open[1] || "").trim(), text: open[2] || "" });
      return parts;
    }

    function codeBlock(text, lang) {
      const body = escapeHtml(text.replace(/\n$/, ""));
      const label = lang ? `<div class="lang">${escapeHtml(lang)}</div>` : "";
      return `<pre>${label}<code>${body}</code></pre>`;
    }

    function renderBlocks(text) {
      const lines = text.split("\n");
      let html = "";
      let i = 0;
      while (i < lines.length) {
        if (!lines[i].trim()) {
          i += 1;
          continue;
        }
        const heading = /^(#{1,3})\s+(.*)$/.exec(lines[i]);
        if (heading) {
          const level = heading[1].length;
          html += `<h${level}>${inline(heading[2])}</h${level}>`;
          i += 1;
          continue;
        }
        if (/^>\s?/.test(lines[i])) {
          const quote = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) {
            quote.push(lines[i].replace(/^>\s?/, ""));
            i += 1;
          }
          html += `<blockquote>${quote.map(inline).join("<br>")}</blockquote>`;
          continue;
        }
        if (/^[-*]\s+/.test(lines[i])) {
          const items = [];
          while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^[-*]\s+/, ""));
            i += 1;
          }
          html += "<ul>" + items.map((item) => `<li>${inline(item)}</li>`).join("") + "</ul>";
          continue;
        }
        if (/^\d+\.\s+/.test(lines[i])) {
          const items = [];
          while (i < lines.length && /^\d+\.\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\d+\.\s+/, ""));
            i += 1;
          }
          html += "<ol>" + items.map((item) => `<li>${inline(item)}</li>`).join("") + "</ol>";
          continue;
        }
        const para = [];
        while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) {
          para.push(lines[i]);
          i += 1;
        }
        html += `<p>${para.map(inline).join("<br>")}</p>`;
      }
      return html;
    }

    function isBlockStart(line) {
      return /^(#{1,3}\s+|[-*]\s+|\d+\.\s+|>\s?)/.test(line);
    }

    function inline(text) {
      const codes = [];
      const held = text.replace(/`([^`]+)`/g, (_, code) => {
        codes.push(code);
        return "\u0000" + (codes.length - 1) + "\u0000";
      });
      let html = escapeHtml(held);
      html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, href) => {
        return `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`;
      });
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, (_, lead, body) => `${lead}<em>${body}</em>`);
      return html.replace(/\u0000(\d+)\u0000/g, (_, index) => `<code>${escapeHtml(codes[Number(index)])}</code>`);
    }

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function paintAssistant(turn) {
      if (!turn.node || !turn.node.article.isConnected) mountAssistant(turn);
      const node = turn.node;
      if (turn.action) {
        node.stamp.hidden = false;
        node.stamp.className = "stamp " + turn.action;
        node.stamp.textContent = actionLabel[turn.action] || turn.action;
      }
      node.body.innerHTML = renderMarkdown(turn.content);
      node.article.classList.toggle("pending", Boolean(turn.pending));
      const bits = [];
      if (turn.sources && turn.sources.length) bits.push("sources " + turn.sources.join(", "));
      if (turn.tool_name) bits.push("tool " + turn.tool_name);
      if (turn.trace_id) bits.push("trace " + turn.trace_id);
      node.meta.hidden = bits.length === 0;
      node.meta.textContent = bits.join("  ·  ");
      const canScore = tracingOn && Boolean(turn.trace_id) && !turn.pending;
      node.feedback.classList.toggle("open", canScore);
      node.up.classList.toggle("active", turn.feedback === 1);
      node.down.classList.toggle("active", turn.feedback === 0);
      node.up.disabled = turn.feedback !== undefined;
      node.down.disabled = turn.feedback !== undefined;
      node.hint.textContent = turn.feedback === undefined
        ? "写回 Langfuse score"
        : (turn.feedback === 1 ? "已标有用" : "已标没用");
      follow(Boolean(turn.pending));
    }

    function follow(force) {
      const gap = transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight;
      if (force || gap < 140) transcript.scrollTop = transcript.scrollHeight;
    }

    function showError(text) {
      error.style.display = text ? "block" : "none";
      error.textContent = text;
    }

    function detail(data) {
      if (!data || !data.detail) return "请求失败";
      return typeof data.detail === "string" ? data.detail : "请求没有通过校验";
    }
  </script>
</body>
</html>
